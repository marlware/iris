name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  playback:
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: write # to publish run history to the iris-results branch
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris
          POSTGRES_DB: iris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://iris:iris@localhost:5432/iris
      IRIS_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fixture
      # Real Chrome, not bundled Chromium: the test stream is H.264.
      - run: npx playwright install chrome
      # Run history lives on the iris-results branch, so each build can be compared with earlier ones.
      - name: Load run history
        run: |
          git fetch --depth=1 origin iris-results             && git show FETCH_HEAD:history.json > history.json             || echo "[]" > history.json
          npm run history -w server -- import ../history.json
      - run: npm run test:e2e
      - name: Regression report
        if: always()
        run: npm run --silent history -w server -- report | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save run history
        if: always() && github.ref == 'refs/heads/main'
        run: |
          npm run history -w server -- export "$RUNNER_TEMP/history.json"
          cd "$(mktemp -d)"
          git init -q -b iris-results
          cp "$RUNNER_TEMP/history.json" history.json
          git add history.json
          git -c user.name=iris-ci -c user.email=iris-ci@users.noreply.github.com commit -qm "run history at ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" iris-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
