name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  playback:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris
          POSTGRES_DB: iris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://iris:iris@localhost:5432/iris
      IRIS_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fixture
      # Real Chrome, not bundled Chromium: the test stream is H.264.
      - run: npx playwright install chrome
      - run: npm run test:e2e
      - name: Dump run results
        if: always()
        run: curl -s localhost:3001/api/runs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
